<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="title description">
  <title id="title">Mimansh</title>
  <desc id="description">Researcher, builder, computer science undergraduate, and AI systems developer.</desc>
  <style>
    .pulse { animation: pulse 6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: .8 } }

    .identity { transform-box: fill-box; transform-origin: center; }
    #mimansh-name { animation: mimanshCycle 12s linear infinite; }
    #walter-name { opacity: 0; animation: walterCycle 12s linear infinite; }
    #mimansh-glitch-a, #mimansh-glitch-b { opacity: 0; animation: mimanshGlitch 12s steps(1, end) infinite; }
    #walter-glitch-a, #walter-glitch-b { opacity: 0; animation: walterGlitch 12s steps(1, end) infinite; }

    @keyframes mimanshCycle {
      0%, 37% { opacity: 1; transform: translateX(0); }
      39% { opacity: .28; transform: translateX(-5px); }
      41% { opacity: .82; transform: translateX(4px); }
      43%, 91% { opacity: 0; transform: translateX(0); }
      93% { opacity: .2; transform: translateX(5px); }
      96% { opacity: .72; transform: translateX(-3px); }
      98%, 100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes walterCycle {
      0%, 42% { opacity: 0; transform: translateX(0); }
      44% { opacity: .3; transform: translateX(5px); }
      47% { opacity: .76; transform: translateX(-3px); }
      49%, 87% { opacity: 1; transform: translateX(0); }
      89% { opacity: .28; transform: translateX(-5px); }
      91% { opacity: .74; transform: translateX(3px); }
      93%, 100% { opacity: 0; transform: translateX(0); }
    }
    @keyframes mimanshGlitch {
      0%, 37%, 44%, 90%, 98%, 100% { opacity: 0; }
      38%, 40%, 42%, 91%, 93%, 95%, 97% { opacity: .72; }
      39%, 41%, 43%, 92%, 94%, 96% { opacity: .18; }
    }
    @keyframes walterGlitch {
      0%, 42%, 49%, 86%, 94%, 100% { opacity: 0; }
      43%, 45%, 47%, 87%, 89%, 91%, 93% { opacity: .68; }
      44%, 46%, 48%, 88%, 90%, 92% { opacity: .16; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .identity { animation: none !important; }
      #mimansh-name { opacity: 1; }
      #walter-name, #mimansh-glitch-a, #mimansh-glitch-b, #walter-glitch-a, #walter-glitch-b { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302d39" />
      <stop offset="0.58" stop-color="#3d3846" />
      <stop offset="1" stop-color="#353248" />
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="22%" r="70%">
      <stop offset="0" stop-color="#9f8cff" stop-opacity=".18" />
      <stop offset="1" stop-color="#9f8cff" stop-opacity="0" />
    </radialGradient>
    <pattern id="minorGrid" x="24" y="24" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#7d9fc4" stroke-width=".5" stroke-opacity=".16" />
    </pattern>
    <pattern id="majorGrid" x="24" y="24" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#7d9fc4" stroke-width=".75" stroke-opacity=".28" />
    </pattern>
    <clipPath id="sliceTop"><rect x="120" y="105" width="560" height="20" /></clipPath>
    <clipPath id="sliceBottom"><rect x="120" y="132" width="560" height="22" /></clipPath>
  </defs>

  <rect width="800" height="270" rx="8" fill="url(#paper)" />
  <rect width="800" height="270" rx="8" fill="url(#glow)" />
  <rect x="24" y="24" width="752" height="222" fill="url(#minorGrid)" />
  <rect x="24" y="24" width="752" height="222" fill="url(#majorGrid)" />
  <rect x="24" y="24" width="752" height="222" fill="none" stroke="#f1ece1" stroke-opacity=".68" />

  <g stroke="#f1ece1">
    <path d="M18 24h12M24 18v12M770 24h12M776 18v12M18 246h12M24 240v12M770 246h12M776 240v12" />
  </g>

  <text x="38" y="43" fill="#7d9fc4" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">PROFILE</text>
  <text x="762" y="43" text-anchor="end" fill="#7d9fc4" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2">MNP · 2026</text>
  <circle class="pulse" cx="769" cy="39" r="2.5" fill="#9f8cff" />
  <line x1="34" y1="52" x2="766" y2="52" stroke="#7d9fc4" stroke-opacity=".42" />

  <g fill="none" stroke="#9f8cff" stroke-opacity=".8">
    <line x1="168" y1="88" x2="632" y2="88" />
  </g>
  <path d="M162 88l8-4v8zM638 88l-8-4v8z" fill="#9f8cff" />

  <g text-anchor="middle">
    <text id="mimansh-name" class="identity" x="400" y="151" fill="#f1ece1" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="8">MIMANSH</text>
    <text id="mimansh-glitch-a" class="identity" x="395" y="151" fill="#9f8cff" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="8" clip-path="url(#sliceTop)">MIMANSH</text>
    <text id="mimansh-glitch-b" class="identity" x="405" y="151" fill="#7d9fc4" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="8" clip-path="url(#sliceBottom)">MIMANSH</text>

    <text id="walter-name" class="identity" x="400" y="147" fill="#f1ece1" font-family="JetBrains Mono, ui-monospace, monospace" font-size="46" font-weight="600" letter-spacing="4">walterwhite91</text>
    <text id="walter-glitch-a" class="identity" x="394" y="147" fill="#9f8cff" font-family="JetBrains Mono, ui-monospace, monospace" font-size="46" font-weight="600" letter-spacing="4" clip-path="url(#sliceTop)">walterwhite91</text>
    <text id="walter-glitch-b" class="identity" x="406" y="147" fill="#7d9fc4" font-family="JetBrains Mono, ui-monospace, monospace" font-size="46" font-weight="600" letter-spacing="4" clip-path="url(#sliceBottom)">walterwhite91</text>
  </g>
  <line x1="165" y1="163" x2="635" y2="163" stroke="#f1ece1" stroke-opacity=".8" />

  <text x="400" y="200" text-anchor="middle" fill="#f1ece1" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1.15">RESEARCHER × BUILDER  ·  CS UNDERGRADUATE  ·  AI SYSTEMS</text>

  <line x1="34" y1="222" x2="766" y2="222" stroke="#7d9fc4" stroke-opacity=".42" />
  <text x="38" y="239" fill="#7d9fc4" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.4">BUILDING PRACTICAL · SCALABLE · ACCESSIBLE SOFTWARE</text>
  <text x="762" y="239" text-anchor="end" fill="#f1ece1" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.4">REV 1.0</text>
</svg>
